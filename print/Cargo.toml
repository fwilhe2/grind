[package]
name = "grind-print"
version = "0.0.0"
description = "Pages, PDF and print preview for the word processor (doc/pdf-export.md)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["system-fonts"]
# Look for fonts installed on the machine as well as the bundled ones. Off in the browser,
# which has no filesystem to look in, and in any build that wants the same bytes everywhere.
system-fonts = ["dep:fontdb"]

[dependencies]
grind-core = { path = "../core" }
grind-text = { path = "../text" }
# The font stack lives here and nowhere else, which is the promise doc/text-layout.md decision 2
# made: `grind-core` stays font-free, and so do the terminal and a `grind` built without `pdf`.
# All three pinned exactly: they are pre-1.0, and they must agree on one `read-fonts` — harfrust
# past 0.8 brings a second copy beside krilla's (`cargo tree -d`, measured 2026-10-04).
skrifa = "=0.42.1"
harfrust = "=0.8.4"
fontdb = { version = "0.24", default-features = false, features = ["std", "fs"], optional = true }
# The PDF writer (doc/pdf-export.md §2): glyphs our own layout placed, subset and embedded, with
# `ToUnicode`, tagging and PDF/A. `simple-text` stays off — harfrust shapes, so there is one
# shaper in the binary — and `raster-images` is what embeds a PNG or a JPEG.
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }

# The preview (doc/pdf-export.md §4): the same display list the PDF is written from, rasterised.
# 0.12 shares `tiny-skia-path` with krilla rather than bringing a second copy.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }

[dev-dependencies]
# A second opinion: our PDF rasterised by a PDF renderer, held against our own raster of the
# same page. Same authors as krilla; a test dependency only.
hayro = "0.8"

# Reading a PDF back to check what was written: its pages and their sizes.
hayro-syntax = "0.8"
