[package]
name = "grind-languagetool"
version = "0.0.0"
description = "The LanguageTool client: grammar checked by a LanguageTool server (doc/grammar.md)"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The HTTP client, for a native binary. The browser shell turns it off and sends the same
# requests through `fetch`.
[features]
default = ["native"]
native = ["dep:ureq", "dep:rustls-native-certs"]

[dependencies]
# What a finding is, and UTF-16 offsets, which LanguageTool counts in.
grind-core = { path = "../core" }
# A paragraph's language from its common words, to send each with its own.
grind-spell = { path = "../spell", default-features = false }
serde_json = "1"
# A small blocking HTTP client with TLS in Rust (rustls, with ring), so `https://` to the public
# and Premium servers needs no system library. Certificates are checked against the operating
# system's own store, read by rustls-native-certs, rather than a bundled copy of Mozilla's —
# which also honours an organisation's own certificate authority.
ureq = { version = "3", optional = true, default-features = false, features = [
    "rustls-no-provider",
    "_ring",
] }
rustls-native-certs = { version = "0.8", optional = true }
