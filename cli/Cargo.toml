[package]
name = "grind-cli"
version = "0.0.0"
description = "An ODF-native office suite — command-line interface"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "grind"
path = "src/main.rs"

[features]
# On by default, because a converter you have to opt into is one nobody has when they need
# it. Off is a real configuration all the same: `--no-default-features` builds a `grind` with
# no Excel code in it at all, and `win32.yml`-style "it still compiles without the feature"
# claims rot silently unless something builds them.
default = ["xlsx"]
xlsx = ["dep:grind-xlsx"]

[dependencies]
# The suite-level half: `kind`, `Form`, and what a lint diagnostic is — the vocabulary a
# command has to speak *before* it knows which application it is talking to.
grind-core = { path = "../core" }
grind-sheet = { path = "../sheet" }
grind-text = { path = "../text" }
# The generator (doc/dsl.md layer 1). **This is the only crate in the workspace that may name
# it** — R11, checked by `build/tests/manifest.rs`: no code path that opens a document
# evaluates anything, and `grind build` is a verb a person types.
grind-build = { path = "../build" }
# The Excel import filter (doc/xlsx-import.md), optional by cargo feature rather than by
# being a separate binary: it belongs *inside* `grind` rather than beside it.
grind-xlsx = { path = "../xlsx", optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read by `cargo deb` (artifacts.yml). No runtime deps beyond libc: `grind-sheet` is
# format-neutral plumbing, not a system library.
[package.metadata.deb]
name = "grind-cli"
maintainer = "Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
copyright = "2026, Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
license-file = ["../LICENSES/AGPL-3.0-or-later.txt", "0"]
section = "utils"
assets = [["target/release/grind", "usr/bin/grind", "755"]]

# Read by `cargo generate-rpm` (artifacts.yml).
[package.metadata.generate-rpm]
name = "grind-cli"
assets = [{ source = "target/release/grind", dest = "/usr/bin/grind", mode = "755" }]
