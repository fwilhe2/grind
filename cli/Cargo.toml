[package]
name = "grind-cli"
version = "0.0.0"
description = "An ODF-native office suite for the command line"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "grind"
path = "src/main.rs"

[dependencies]
# The suite-level half: `kind`, `Form`, and what a lint diagnostic is — the vocabulary a
# command has to speak *before* it knows which application it is talking to.
grind-core = { path = "../core" }
grind-sheet = { path = "../sheet" }
grind-text = { path = "../text" }
# The generator (doc/dsl.md layer 1). **This is the only crate in the workspace that may name
# it** — R11, checked by `build/tests/manifest.rs`: no code path that opens a document
# evaluates anything, and `grind build` is a verb a person types.
grind-build = { path = "../build" }
# The import filters belong *inside* `grind` rather than beside it as separate binaries.
grind-xlsx = { path = "../xlsx" }
grind-docx = { path = "../docx" }
grind-print = { path = "../print" }
grind-spell = { path = "../spell" }
grind-grammar = { path = "../grammar" }
# The language server. A reader under R11, so it links no evaluator: this crate hands it the
# vocabulary and the compile-only syntax check through `grind_lsp::Host`.
grind-lsp = { path = "../lsp" }
grind-server = { path = "../server" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# `grind serve` as a container's PID 1 gets no default action for SIGTERM.
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }

# Read by `cargo deb` (artifacts.yml). No runtime deps beyond libc: `grind-sheet` is
# format-neutral plumbing, not a system library.
[package.metadata.deb]
name = "grind-cli"
maintainer = "Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
copyright = "2026, Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
license-file = ["../packaging/copyright", "0"]
section = "utils"
extended-description = """\
grind is the command line of an office suite whose native format is \
OpenDocument (ODF). It creates, reads, edits, recalculates and converts \
spreadsheets (.ods, .fods) and text documents (.odt, .fodt) with no window: \
it sets cells, evaluates formulas with OpenFormula's own semantics, types and \
formats text, checks a document with `grind lint`, and exports PDF and CSV. \
It imports Excel workbooks and Word documents without ever writing either, \
reads and writes Markdown, and `grind build` turns a script into a document. \
Everything the suite's windows can do, this command can do too."""
assets = [["target/release/grind", "usr/bin/grind", "755"]]

# Read by `cargo generate-rpm` (artifacts.yml).
#
# ponytail: the .rpm's Description is its summary again — `cargo generate-rpm` has no key for a
# long one (cat-in-136/cargo-generate-rpm#142), so `extended-description` above reaches the .deb
# only, and GNOME Software shows a local .rpm with one line. Upgrade: that key, once released.
[package.metadata.generate-rpm]
name = "grind-cli"
assets = [
    { source = "target/release/grind", dest = "/usr/bin/grind", mode = "755" },
    { source = "../LICENSES/AGPL-3.0-or-later.txt", dest = "/usr/share/licenses/grind-cli/AGPL-3.0-or-later.txt", mode = "644" },
]
