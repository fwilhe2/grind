[package]
name = "grind-sheet-gtk"
version = "0.0.0"
description = "An ODF-native spreadsheet — the GNOME shell"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "grind-sheet-gtk"
path = "src/main.rs"

[dependencies]
grind-sheet = { path = "../sheet" }
# Named directly for one thing only: `search::score`, which ranks the command palette. The
# spreadsheet's own vocabulary all arrives through `grind-sheet`; this is the generic half,
# and it is a direct dependency rather than a re-export because ranking a list of words is
# not a spreadsheet's business to hand on (R8, from the other side).
grind-core = { path = "../core" }
# gtk4 is reached as `libadwaita::gtk`, so the two versions cannot drift apart.
# The GNOME HIG widgets — banners, toasts, alert dialogs — are libadwaita's own.
# v1_5 is the ubuntu-24.04 runtime, and every widget this shell uses exists there.
libadwaita = { version = "0.7", features = ["v1_5"] }
# Named only to turn on newer GTK APIs — `gtk::FileDialog` (4.10), `CssProvider::
# load_from_string` (4.12), `Accessible::announce` (4.14, M9's a11y floor); libadwaita
# forwards gtk feature flags only up to 4.6. 4.14 is the ubuntu-24.04 runtime, which is what
# CI builds against. Still reached in code as `libadwaita::gtk`, and cargo unifies the two
# into one crate, so the versions cannot drift.
gtk4 = { version = "0.9", features = ["v4_14"] }
# The observer bridge: the core pushes changes from whatever thread made them, and the
# main loop drains them. `glib`'s own channel was removed in gtk4-rs 0.16 and this is what
# replaced it.
async-channel = "2"

# Read by `cargo deb` (packaging.yml). `depends = "$auto"` reads the actual shared-library
# needs off the built binary (`libgtk-4-1`, `libadwaita-1-0`, …) rather than naming them
# twice and letting the two lists drift.
[package.metadata.deb]
name = "grind-sheet-gtk"
maintainer = "Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
copyright = "2026, Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
license-file = ["../LICENSES/AGPL-3.0-or-later.txt", "0"]
section = "gnome"
depends = "$auto"
assets = [
    ["target/release/grind-sheet-gtk", "usr/bin/grind-sheet-gtk", "755"],
    ["data/io.github.fwilhe2.Sheet.desktop", "usr/share/applications/", "644"],
    ["data/io.github.fwilhe2.Sheet.metainfo.xml", "usr/share/metainfo/", "644"],
    [
        "data/icons/hicolor/scalable/apps/io.github.fwilhe2.Sheet.svg",
        "usr/share/icons/hicolor/scalable/apps/",
        "644",
    ],
]

# Read by `cargo generate-rpm` (packaging.yml). It has no `$auto` equivalent, so the
# shared-library names are spelled out — the same two libraries `depends` above discovers.
[package.metadata.generate-rpm]
name = "grind-sheet-gtk"
assets = [
    { source = "target/release/grind-sheet-gtk", dest = "/usr/bin/grind-sheet-gtk", mode = "755" },
    { source = "data/io.github.fwilhe2.Sheet.desktop", dest = "/usr/share/applications/io.github.fwilhe2.Sheet.desktop", mode = "644" },
    { source = "data/io.github.fwilhe2.Sheet.metainfo.xml", dest = "/usr/share/metainfo/io.github.fwilhe2.Sheet.metainfo.xml", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/io.github.fwilhe2.Sheet.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.fwilhe2.Sheet.svg", mode = "644" },
]
[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
