name: win32

# See `ci.yml` for why `push` is restricted to `main`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: win32-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# **What is not here any more.** This workflow used to hold three jobs: this one, a `build`
# job on `windows-latest`, and a `render` job that compiled the same executable a second time
# on a second Windows runner so it could draw two frames with it. Both have moved into
# `artifacts.yml`'s `windows` job, where one release build serves the import-table check, the
# stack-reserve check, the version-resource check, both reproducible renders, the size record
# and the per-crate breakdown — which a third workflow used to compile it a third time for.
#
# What is left is the job that has no Windows in it at all, and it stays a workflow of its own
# because it is the fast one: it answers in about a minute, on the cheapest runner there is,
# while the Windows runner is still installing a toolchain.
jobs:
  # The new thing this shell makes possible, and the reason it gets a job of its own on the
  # cheapest runner there is: `cargo check` does not link, so it never needs MSVC and the
  # Windows-only source can be type-checked without Windows. It catches a `windows`-rs API
  # change in about a minute rather than waiting on the Windows runner, and it is the same
  # check a contributor runs on a Linux laptop:
  #
  #     rustup target add x86_64-pc-windows-msvc
  #     cargo check -p grind-win32 --target x86_64-pc-windows-msvc
  #
  # `ui_sheet_gtk` cannot be examined this way at all — it needs GTK to compile.
  #
  # `cargo build --target` would *fail* here, and that is not a bug: it tries to link and
  # there is no linker. Only `check` belongs on this runner.
  check-from-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Its own key: this job builds for a target no other job here does, and every step
          # below shares the one target directory.
          shared-key: linux-msvc-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Type-check the Windows source without Windows
        run: cargo check --locked -p grind-win32 --target x86_64-pc-windows-msvc
      # This is also the *only* clippy run for this crate as Windows compiles it.
      # `artifacts.yml`'s Windows job used to lint it again, and `x86_64-pc-windows-msvc` is
      # that runner's host target — so the two invocations read the same source through the
      # same `cfg`s and produced the same lints.
      - name: Lint it, for Windows, without Windows
        run: cargo clippy --locked -p grind-win32 --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      # `ci.yml`'s `docs` job runs this crate too, but on the *host* target, where every
      # `cfg(windows)` item is compiled out — so a broken intra-doc link in `win.rs` or
      # `metrics.rs` was invisible to it. Six of them had accumulated by W8. rustdoc does not
      # link either, so the same trick the type-check above uses works here.
      - name: Document it, for Windows, without Windows
        run: cargo doc --no-deps --locked -p grind-win32 --target x86_64-pc-windows-msvc
        env:
          RUSTDOCFLAGS: -D warnings
      # The portable half — the argument handling, the pixel arithmetic, the key tables, the
      # menus as data — tested where every other crate in this workspace is tested. The
      # `cfg(windows)` half of the same test files, including the virtual-key codes checked
      # against the real `winuser.h` values, runs on `windows-latest` in `artifacts.yml`.
      - name: Test the windowless modules
        run: cargo test --locked -p grind-win32
