name: Container Image

# Both images are multi-arch, and neither is built under emulation. A qemu
# `linux/arm64` leg on an amd64 runner compiles Rust perhaps an order of
# magnitude slower than a native one, and this repository's two images are
# nothing *but* a Rust compile — so each architecture is built on a runner of its
# own architecture (`ubuntu-24.04` and `ubuntu-24.04-arm`, both free for a public
# repository) and the two are joined afterwards.
#
# The consequence for the tags: a build job pushes `latest-amd64` /
# `latest-arm64`, and a manifest job publishes `latest` pointing at both. Nothing
# pulling `latest` sees the difference.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  # Push container images
  packages: write

jobs:
  cli-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/fwilhe2/grind

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `load: true` rather than `push: true` so the image is in the local daemon
      # for the smoke test below — an image that cannot run is never pushed.
      #
      # **`mode=min`, not `mode=max`, and the reason is a budget rather than a preference.**
      # A repository gets 10 GB of Actions cache, shared by everything in it. `mode=max`
      # exports every intermediate layer of both images on both architectures, and it grew to
      # 5.88 GiB across 179 entries — 54% of the whole allowance — which pushed the total to
      # 10.88 GB and made GitHub evict by least-recent-use. What it evicted was the Rust
      # caches the other workflows depend on, so those quietly recompiled from cold and the
      # measured saving from caching them at all was near zero.
      #
      # `mode=min` exports only the layers of the final image. That is a real loss for a
      # multi-stage build, and here it is close to a nominal one: both Containerfiles `COPY`
      # the whole repository immediately before the compile, so any source change already
      # invalidates the build layer and the intermediates could never be reused between
      # commits anyway. Giving them a dependency layer — as `ui_web/Dockerfile` already does
      # for `wasm-bindgen-cli` — is what would make caching these builds worth its space, and
      # is the open item here.
      - name: Build Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Containerfile.distroless-cli
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:latest-${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=grind-cli-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=grind-cli-${{ matrix.arch }}

      - name: Print Sheet Version
        run: docker run --rm "$IMAGE:latest-${{ matrix.arch }}" /grind --version

      # The README calls this image "about as small as one gets", which is a
      # claim, so measure it. Here rather than only in the manifest job because
      # this step runs on a pull request too, where nothing is pushed — a change
      # that doubles the image is then visible before it is merged.
      - name: Measure image size
        run: .github/scripts/image-size.sh local "$IMAGE:latest-${{ matrix.arch }}"

      - name: Push architecture image
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push "$IMAGE:latest-${{ matrix.arch }}"

  cli-manifest:
    if: ${{ github.event_name != 'pull_request' }}
    needs: cli-image
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/fwilhe2/grind
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:latest-amd64" \
            "$IMAGE:latest-arm64"

      # What a `docker pull ghcr.io/fwilhe2/grind:latest` costs, per architecture,
      # read back off the registry: the build jobs' figure is whatever the daemon
      # that built it says, this one is the compressed bytes a client transfers.
      - name: Measure published image size
        run: .github/scripts/image-size.sh remote "$IMAGE:latest"

  web-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/fwilhe2/grind-web

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The context is the repository root: grind-web depends on grind-core,
      # grind-sheet and grind-text, so ui_web/ alone would not build.
      - name: Build Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./ui_web/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:latest-${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=grind-web-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=grind-web-${{ matrix.arch }}

      # The image serves static files, so there is no --version to print; run it
      # and ask for the page it built instead, the same shape of check as the
      # CLI job's "Print Sheet Version" step above.
      - name: Smoke test the served page
        run: |
          docker run -d --rm --name grind-web-smoke -p 8080:80 \
            "$IMAGE:latest-${{ matrix.arch }}"
          timeout 10 sh -c 'until curl -sf http://localhost:8080/index.html >/dev/null; do sleep 0.5; done'
          docker stop grind-web-smoke

      # As in the CLI job: on a pull request this is the only size measurement
      # there can be, since a fork never pushes.
      - name: Measure image size
        run: .github/scripts/image-size.sh local "$IMAGE:latest-${{ matrix.arch }}"

      - name: Push architecture image
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push "$IMAGE:latest-${{ matrix.arch }}"

  web-manifest:
    if: ${{ github.event_name != 'pull_request' }}
    needs: web-image
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/fwilhe2/grind-web
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:latest-amd64" \
            "$IMAGE:latest-arm64"

      - name: Measure published image size
        run: .github/scripts/image-size.sh remote "$IMAGE:latest"
