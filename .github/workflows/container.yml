name: Container Image

# Every image is multi-arch, and none is built under emulation. A qemu
# `linux/arm64` leg on an amd64 runner compiles Rust perhaps an order of
# magnitude slower than a native one, and this repository's images are
# nothing *but* a Rust compile — so each architecture is built on a runner of its
# own architecture (`ubuntu-24.04` and `ubuntu-24.04-arm`, both free for a public
# repository) and the two are joined afterwards.
#
# The consequence for the tags: a build job pushes `<tag>-amd64` / `<tag>-arm64`,
# and a manifest job publishes `<tag>` pointing at both. Nothing pulling `<tag>`
# sees the difference.
#
# `<tag>` is `dev` for a push to main. `release.yml` calls this workflow with the
# release's tag and version, and then it is the version, and `latest` as well:
# `latest` is the newest release, `dev` the newest build of main.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The git ref to build, the release's tag
        type: string
        required: true
      version:
        description: The release version, tagged alongside latest
        type: string
        required: true

permissions:
  contents: read
  # Push container images
  packages: write

jobs:
  cli-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/fwilhe2/grind
      TAG: ${{ inputs.version || 'dev' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `load: true` rather than `push: true` so the image is in the local daemon
      # for the smoke test below — an image that cannot run is never pushed.
      #
      # **`mode=min`, not `mode=max`, and the reason is a budget rather than a preference.**
      # A repository gets 10 GB of Actions cache, shared by everything in it. `mode=max`
      # exports every intermediate layer of both images on both architectures, and it grew to
      # 5.88 GiB across 179 entries — 54% of the whole allowance — which pushed the total to
      # 10.88 GB and made GitHub evict by least-recent-use. What it evicted was the Rust
      # caches the other workflows depend on, so those quietly recompiled from cold and the
      # measured saving from caching them at all was near zero.
      #
      # `mode=min` exports only the layers of the final image. That is a real loss for a
      # multi-stage build, and here it is close to a nominal one: both Containerfiles `COPY`
      # the whole repository immediately before the compile, so any source change already
      # invalidates the build layer and the intermediates could never be reused between
      # commits anyway. Giving them a dependency layer — as `ui_web/Dockerfile` already does
      # for `wasm-bindgen-cli` — is what would make caching these builds worth its space, and
      # is the open item here.
      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile.distroless-cli
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          labels: org.opencontainers.image.version=${{ env.TAG }}
          load: true
          cache-from: type=gha,scope=grind-cli-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=grind-cli-${{ matrix.arch }}

      # The version the checkout says, from the commit checked out, a clean tree, a release build.
      - name: What grind says it is
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          .github/scripts/check-version.sh "$version" docker run --rm "$IMAGE:$TAG-${{ matrix.arch }}" /grind

      # The README calls this image "about as small as one gets", which is a
      # claim, so measure it. Here rather than only in the manifest job because
      # this step runs on a pull request too, where nothing is pushed — a change
      # that doubles the image is then visible before it is merged.
      - name: Measure image size
        run: .github/scripts/image-size.sh local "$IMAGE:$TAG-${{ matrix.arch }}"

      - name: Push architecture image
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push "$IMAGE:$TAG-${{ matrix.arch }}"

  cli-manifest:
    if: ${{ github.event_name != 'pull_request' }}
    needs: cli-image
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/fwilhe2/grind
      TAG: ${{ inputs.version || 'dev' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        run: |
          tags=(--tag "$IMAGE:$TAG")
          if [ -n "${{ inputs.version }}" ]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"

      # What a `docker pull ghcr.io/fwilhe2/grind:$TAG` costs, per architecture,
      # read back off the registry: the build jobs' figure is whatever the daemon
      # that built it says, this one is the compressed bytes a client transfers.
      - name: Measure published image size
        run: .github/scripts/image-size.sh remote "$IMAGE:$TAG"

  web-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/fwilhe2/grind-web
      TAG: ${{ inputs.version || 'dev' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The context is the repository root: the page and grind are built from one
      # tree, which is what keeps them the same build.
      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./ui_web/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          labels: org.opencontainers.image.version=${{ env.TAG }}
          load: true
          cache-from: type=gha,scope=grind-web-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=grind-web-${{ matrix.arch }}

      - name: What grind says it is
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          .github/scripts/check-version.sh "$version" docker run --rm "$IMAGE:$TAG-${{ matrix.arch }}"

      # grind serve listens on 127.0.0.1 only, so the container shares the runner's network
      # rather than publishing a port. It answers the page's probe and serves the page.
      - name: Smoke test the served page
        run: |
          mkdir -p "$RUNNER_TEMP/documents" && chmod 777 "$RUNNER_TEMP/documents"
          docker run -d --rm --name grind-web-smoke --network host \
            -v "$RUNNER_TEMP/documents:/documents" "$IMAGE:$TAG-${{ matrix.arch }}"
          timeout 10 sh -c 'until curl -sf http://127.0.0.1:8080/api/v1/hello; do sleep 0.5; done'
          curl -sf http://127.0.0.1:8080/index.html >/dev/null
          docker stop grind-web-smoke

      # As in the CLI job: on a pull request this is the only size measurement
      # there can be, since a fork never pushes.
      - name: Measure image size
        run: .github/scripts/image-size.sh local "$IMAGE:$TAG-${{ matrix.arch }}"

      - name: Push architecture image
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push "$IMAGE:$TAG-${{ matrix.arch }}"

  web-manifest:
    if: ${{ github.event_name != 'pull_request' }}
    needs: web-image
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/fwilhe2/grind-web
      TAG: ${{ inputs.version || 'dev' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        run: |
          tags=(--tag "$IMAGE:$TAG")
          if [ -n "${{ inputs.version }}" ]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"

      - name: Measure published image size
        run: .github/scripts/image-size.sh remote "$IMAGE:$TAG"
