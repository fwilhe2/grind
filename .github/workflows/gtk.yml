name: gtk
on: [push, pull_request]

jobs:
  gtk:
    # Its own workflow on its own runner, never cross-compiled (doc/gtk-shell.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      # The shell's testable half is the widget-free modules — geometry, keys, the
      # edit state machine — and none of them need a display, so nothing here wants
      # a compositor.
      - run: cargo test -p grind-sheet-gtk --all-targets
      # The lint and doc gates the `ci` workflow runs for every other crate. They live here
      # because they compile the shell, and compiling it needs the packages above.
      - run: cargo clippy -p grind-sheet-gtk --all-targets -- -D warnings
      - run: cargo doc --no-deps -p grind-sheet-gtk
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --release -p grind-sheet-gtk
