version = 1
SPDX-PackageName = "grind"
SPDX-PackageSupplier = "Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/fwilhe2/grind"

# Generated by cargo; a header here would be stripped on the next regeneration.
[[annotations]]
path = "Cargo.lock"
SPDX-FileCopyrightText = "2026 Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The knowledge-base corpus: hand-written ODF documents from
# https://github.com/fwilhe2/open-document-knowledge-base (MIT), vendored at
# 46421e5 (2026-06-22). Declared here rather than annotated, because a header
# inside the XML would change the documents under test.
[[annotations]]
path = "sheet/tests/data/kb/**"
SPDX-FileCopyrightText = "2022 Florian Wilhelm"
SPDX-License-Identifier = "MIT"

# The sample corpus: LibreOffice-authored documents normalised by `odslint-clean`, from
# https://github.com/fwilhe2/office-in-git, vendored at d01d7f6 (2026-07-21). Upstream
# states no license; the author is the same person and set them MIT here, matching the
# corpus above. Declared rather than annotated for the same reason.
[[annotations]]
path = "sheet/tests/data/samples/**"
SPDX-FileCopyrightText = "2026 Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
SPDX-License-Identifier = "MIT"

# Vendored OASIS specifications. Their terms forbid modifying the documents at all,
# so these are marked by .license sidecars rather than by headers; the entries here
# exist so the constraint is stated in one place a reader will find.
#
#   doc/OpenDocument-v1.4-schema.rng            -> .rng.license
#   doc/OpenDocument-v1.4-os-part4-formula.html -> .html.license
#
# Do not run `reuse annotate` against those two paths without --force-dot-license.
