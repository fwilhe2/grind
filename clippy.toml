# Names of products and formats a doc comment writes as prose, which `doc_markdown` would
# otherwise want in backticks as if they were identifiers. `..` keeps clippy's own list.
doc-valid-idents = [
    "..",
    "AppKit",
    "AppStream",
    "AutoFormat",
    "AutoSum",
    "CommonMark",
    "DrawingML",
    "HiDPI",
    "LaunchServices",
    "LibreOffice",
    "OpenDocument",
    "OpenFormula",
    "OpenOffice",
    "PDFKit",
    "SheetJS",
    "SmartArt",
    "SpreadsheetML",
    "TextEdit",
    "VoiceOver",
    "WebAIM",
    "WinUI",
    "WordprocessingML",
    "XLink",
]
