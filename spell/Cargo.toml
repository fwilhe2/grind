[package]
name = "grind-spell"
version = "0.0.0"
description = "Spelling dictionaries for the word processor (doc/spelling.md)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The `Lexicon` trait this crate implements, the rules for what a word is, and `Spelled` — the
# one door into a document of either kind. The dictionaries are the only thing that lives here,
# and no application crate is a dependency: both are only tested against.
grind-core = { path = "../core" }
# A Hunspell-compatible checker in pure Rust (doc/spelling.md, "Why spellbook"): no system
# library, so the same answers on every platform this suite builds for. Pre-1.0, so pinned.
spellbook = "=0.4.2"

[dev-dependencies]
grind-text = { path = "../text" }
grind-sheet = { path = "../sheet" }
