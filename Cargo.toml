[workspace]
members = [
    "core",
    "sheet",
    "text",
    "build",
    "cli",
    "xlsx",
    "ooxml",
    "docx",
    "print",
    "spell",
    "ui_sheet_gtk",
    "ui_text_gtk",
    "ui_tui",
    "ui_web",
    "ui_web_print",
    "ui_win32",
    "ui_mac",
    "suite",
]
# What bare `cargo build` / `cargo test` walk: everything that needs no system package.
# Without this, the default commands try to compile the GTK shells and fail on a machine with
# no `libgtk-4-dev`, which is why CI has always named crates explicitly. `--workspace` still
# builds every member on demand.
default-members = ["core", "sheet", "text", "build", "cli", "xlsx", "ooxml", "docx", "print", "spell"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/fwilhe2/grind"

# The XML parser, the zip reader, the inflater and the byte scanner under them, optimised even
# in a debug build. Every reader in the suite spends its time in these four and none of them
# is ever debugged from here, so an unoptimised copy only makes `cargo test` slow: the
# generated xlsx corpus's 500,000-cell sheet imported in 14 s without this and in 5 s with it.
# Our own crates stay at the dev profile's level, so a backtrace into them is still a good one.
[profile.dev.package.quick-xml]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
# The same argument for the PDF's font stack (doc/pdf-export.md): shaping, outlines, subsetting
# and the PDF writer. An unoptimised harfrust shapes a page of text slower than a person reads it.
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.subsetter]
opt-level = 3
[profile.dev.package.krilla]
opt-level = 3
# And for spelling (doc/spelling.md): an unoptimised spellbook takes most of a second to parse
# the German dictionary, which every test and every debug shell that checks spelling pays.
[profile.dev.package.spellbook]
opt-level = 3
[profile.dev.package.hashbrown]
opt-level = 3
[profile.dev.package.foldhash]
opt-level = 3
