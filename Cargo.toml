[workspace]
members = [
    "core",
    "sheet",
    "text",
    "build",
    "cli",
    "xlsx",
    "ooxml",
    "docx",
    "print",
    "spell",
    "grammar",
    "lsp",
    "server",
    "open",
    "ui_sheet_gtk",
    "ui_text_gtk",
    "ui_tui",
    "ui_web",
    "ui_web_print",
    "ui_win32",
    "ui_mac",
    "suite",
]
# What bare `cargo build` / `cargo test` walk: everything that needs no system package.
# Without this, the default commands try to compile the GTK shells and fail on a machine with
# no `libgtk-4-dev`, which is why CI has always named crates explicitly. `--workspace` still
# builds every member on demand.
default-members = ["core", "sheet", "text", "build", "cli", "xlsx", "ooxml", "docx", "print", "spell", "grammar", "lsp", "open", "server"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/fwilhe2/grind"

# Clippy's pedantic group, for every crate (`[lints] workspace = true`), under CI's warnings as
# errors (`doc/rust-idioms.md` §5). The group goes first so the lines after it can answer it.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The tree is not yet clean of these. A line goes in the commit that fixes its lint; none is
# added.
assigning_clones = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
float_cmp = "allow"
fn_params_excessive_bools = "allow"
format_collect = "allow"
format_push_string = "allow"
ignored_unit_patterns = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
manual_midpoint = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
match_wild_err_arm = "allow"
match_wildcard_for_single_variants = "allow"
maybe_infinite_iter = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_continue = "allow"
needless_pass_by_value = "allow"
nonminimal_bool = "allow"
option_option = "allow"
ref_option = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_box_returns = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"

# The XML parser, the zip reader, the inflater and the byte scanner under them, optimised even
# in a debug build. Every reader in the suite spends its time in these four and none of them
# is ever debugged from here, so an unoptimised copy only makes `cargo test` slow: the
# generated xlsx corpus's 500,000-cell sheet imported in 14 s without this and in 5 s with it.
# Our own crates stay at the dev profile's level, so a backtrace into them is still a good one.
[profile.dev.package.quick-xml]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
# The same argument for the PDF's font stack (doc/pdf-export.md): shaping, outlines, subsetting
# and the PDF writer. An unoptimised harfrust shapes a page of text slower than a person reads it.
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.subsetter]
opt-level = 3
[profile.dev.package.krilla]
opt-level = 3
# And for spelling (doc/spelling.md): an unoptimised spellbook takes most of a second to parse
# the German dictionary, which every test and every debug shell that checks spelling pays.
[profile.dev.package.spellbook]
opt-level = 3
[profile.dev.package.hashbrown]
opt-level = 3
[profile.dev.package.foldhash]
opt-level = 3
