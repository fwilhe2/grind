[package]
name = "grind-tui"
version = "0.0.0"
description = "An ODF-native spreadsheet and word processor for the terminal"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "grind-tui"
path = "src/main.rs"

# The Excel import filter (`doc/xlsx-import.md`, X6): on by default, as in `grind-cli`.
[features]
default = ["xlsx", "docx", "pdf"]
xlsx = ["dep:grind-xlsx"]
# The Word import filter (`doc/docx-import.md`, DX6), likewise.
docx = ["dep:grind-docx"]
# `:pdf` and `:pages` (doc/pdf-export.md). Optional because it is where the font stack lives:
# off, the terminal is the font-free shell doc/text-layout.md promised it could be.
pdf = ["dep:grind-print"]

[dependencies]
grind-xlsx = { path = "../xlsx", optional = true }
grind-docx = { path = "../docx", optional = true }
grind-print = { path = "../print", optional = true }
# One binary, both document types: `grind_core::kind` decides which shell runs (R10).
grind-core = { path = "../core" }
grind-sheet = { path = "../sheet" }
grind-text = { path = "../text" }
# Spelling (doc/spelling.md): the dictionaries, attached before Check Document runs.
grind-spell = { path = "../spell" }
# crossterm is used through `ratatui::crossterm`, so the two can never drift apart.
ratatui = "0.30"
unicode-width = "0.2.2"

# Read by `cargo deb` (artifacts.yml). No runtime deps beyond libc: `grind-sheet` is
# format-neutral plumbing, not a system library.
[package.metadata.deb]
name = "grind-tui"
maintainer = "Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
copyright = "2026, Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
license-file = ["../packaging/copyright", "0"]
section = "utils"
extended-description = """\
grind-tui opens OpenDocument spreadsheets and text documents in a terminal: one \
program for both, chosen from what the file contains rather than its name. A \
spreadsheet is a grid with the document's own column widths, formulas with \
completion, find and replace, and CSV in and out; a text document is edited \
with vi keys, with tables drawn as grids and **bold** typed as Markdown. Excel \
workbooks and Word documents open as new, unsaved ODF documents. Part of \
grind, an office suite whose native format is OpenDocument."""
assets = [["target/release/grind-tui", "usr/bin/grind-tui", "755"]]

# Read by `cargo generate-rpm` (artifacts.yml).
#
# ponytail: the .rpm's Description is its summary again — `cargo generate-rpm` has no key for a
# long one (cat-in-136/cargo-generate-rpm#142), so `extended-description` above reaches the .deb
# only, and GNOME Software shows a local .rpm with one line. Upgrade: that key, once released.
[package.metadata.generate-rpm]
name = "grind-tui"
assets = [
    { source = "target/release/grind-tui", dest = "/usr/bin/grind-tui", mode = "755" },
    { source = "../LICENSES/AGPL-3.0-or-later.txt", dest = "/usr/share/licenses/grind-tui/AGPL-3.0-or-later.txt", mode = "644" },
]
