#
# The browser shell and `grind serve` behind it, deployed to Kubernetes. Applies as it stands:
#
#   kubectl apply -f ui_web/deploy/kubernetes.yaml
#   kubectl -n grind create secret generic grind-web-login --from-literal=user=grind \
#     --from-literal=password-hash="$(podman run --rm docker.io/library/caddy:2.11.9 \
#       caddy hash-password --plaintext 'the password')"
#   kubectl -n grind rollout status deploy/grind-web
#   kubectl -n grind port-forward svc/grind-web 8080:80   # http://localhost:8080
#
# and to reach it from outside the cluster, ui_web/deploy/httproute.yaml or ingress.yaml, which
# are separate files because they cannot be written without knowing the cluster's host name.
#
#   kubectl delete -f ui_web/deploy/kubernetes.yaml        # the documents' claim goes with it
#
# **`grind serve` listens on 127.0.0.1 only** (doc/local-only.md), so nothing outside the pod
# can reach it directly. A second container, Caddy, shares the pod's network, listens on the
# pod's address and hands every request to grind on loopback: Caddy is the reverse proxy, and
# grind still never listens beyond loopback. grind answers only requests addressed to a name it
# was given, so the host name the Ingress or Gateway serves goes into `--host` below.
#
# **The proxy asks for a login.** Whoever reaches the Service can read, overwrite and delete
# every document, and grind itself checks only that a request comes from its own page, which any
# program can pretend to be. So Caddy requires the user and bcrypt hash in the Secret
# `grind-web-login`, made by the command above and kept out of this file; until it exists the
# pod does not start. One login for everybody: this is one person's documents, reached remotely.
#
# **This one has state**: the documents, on the PersistentVolumeClaim at the end. One replica,
# replaced rather than rolled, because two servers over one directory would each take the other's
# saves for somebody else's. Back up the volume; the page keeps no copy.
#
# Namespace, ConfigMap, PersistentVolumeClaim, Deployment, Service, in that order.
---
apiVersion: v1
kind: Namespace
metadata:
  name: grind
  labels:
    app.kubernetes.io/name: grind-web
    # Both images run unprivileged and the pod below satisfies the `restricted` Pod Security
    # Standard as written, so enforce it rather than leaving it to the cluster default. If this
    # fails to admit, the pod spec regressed.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# The whole proxy: the pod's port 8081 to grind on loopback, behind the login. Caddy keeps the
# request's Host and Origin, which is what grind checks them against. Port 8082 is for the
# kubelet alone and is not in the Service: Caddy's own health, and grind's hello, with no login.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grind-web-proxy
  namespace: grind
  labels:
    app.kubernetes.io/name: grind-web
    app.kubernetes.io/part-of: grind
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }
    :8081 {
      basic_auth {
        {$GRIND_USER} {$GRIND_PASSWORD_HASH}
      }
      reverse_proxy 127.0.0.1:8080
    }
    :8082 {
      handle /healthz {
        respond 200
      }
      handle /api/v1/hello {
        reverse_proxy 127.0.0.1:8080
      }
      handle {
        respond 404
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grind-documents
  namespace: grind
  labels:
    app.kubernetes.io/name: grind-web
    app.kubernetes.io/part-of: grind
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grind-web
  namespace: grind
  labels:
    app.kubernetes.io/name: grind-web
    app.kubernetes.io/component: browser-shell
    app.kubernetes.io/part-of: grind
spec:
  replicas: 1
  # The old pod lets go of the volume before the new one takes it.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: grind-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grind-web
        app.kubernetes.io/component: browser-shell
        app.kubernetes.io/part-of: grind
    spec:
      # It talks to no API server and to nothing else in the cluster.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the volume is writable by that user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: grind-web
          # Published by .github/workflows/container.yml on every push to main, as a
          # multi-arch manifest, so this one line is amd64 and arm64 both.
          #
          # `latest` is a moving tag: `imagePullPolicy: Always` is what makes a
          # restarted pod pick up a new build, and is also why a rollout is not
          # reproducible. For anything you want to be able to roll back to, pin the
          # digest instead and drop the pull policy:
          #
          #   docker buildx imagetools inspect ghcr.io/fwilhe2/grind-web:latest
          #   image: ghcr.io/fwilhe2/grind-web@sha256:<digest>
          image: ghcr.io/fwilhe2/grind-web:latest
          imagePullPolicy: Always
          # EDIT: the host name httproute.yaml or ingress.yaml serves. `localhost` (what
          # `kubectl port-forward` sends) is always allowed.
          args: ["serve", "/documents", "--port", "8080", "--host", "grind.example.com"]

          # No port: grind listens on the pod's loopback, which the proxy below shares.

          # Through the proxy's port for the kubelet, since the pod's address cannot reach
          # loopback; on this container, so that a grind that stops answering is the one
          # restarted. The Host header is one grind answers to, since the pod's IP is not.
          readinessProbe:
            httpGet:
              path: /api/v1/hello
              port: 8082
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/hello
              port: 8082
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: documents
              mountPath: /documents

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              # A save of up to 64 MB is held, and read as a document to be checked, in
              # memory; the page itself is served from disk.
              memory: 1Gi
              cpu: "1"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        - name: proxy
          # Pinned by digest, as grind's image should be for a rollback: this is the request
          # path, and the build whose binary carries `cap_net_bind_service` as permitted only,
          # which is what lets it start with every capability dropped.
          image: docker.io/library/caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          env:
            - name: GRIND_USER
              valueFrom:
                secretKeyRef:
                  name: grind-web-login
                  key: user
            - name: GRIND_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: grind-web-login
                  key: password-hash
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: probe
              containerPort: 8082
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: proxy-config
              mountPath: /etc/caddy
              readOnly: true
            # Caddy's own state directories; it keeps nothing worth keeping here.
            - name: proxy-data
              mountPath: /data
            - name: proxy-state
              mountPath: /config

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
              cpu: "1"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: grind-documents
        - name: proxy-config
          configMap:
            name: grind-web-proxy
        - name: proxy-data
          emptyDir: {}
        - name: proxy-state
          emptyDir: {}

      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: grind-web
  namespace: grind
  labels:
    app.kubernetes.io/name: grind-web
    app.kubernetes.io/part-of: grind
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grind-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
