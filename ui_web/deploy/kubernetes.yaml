#
# The browser shell and `grind serve` behind it, deployed to Kubernetes. Applies as it stands:
#
#   kubectl apply -f ui_web/deploy/kubernetes.yaml
#   kubectl -n grind rollout status deploy/grind-web
#   kubectl -n grind port-forward svc/grind-web 8080:80   # http://localhost:8080
#
# and to reach it from outside the cluster, ui_web/deploy/httproute.yaml or ingress.yaml, which
# are separate files because they cannot be written without knowing the cluster's host name.
#
#   kubectl delete -f ui_web/deploy/kubernetes.yaml        # the documents' claim goes with it
#
# **`grind serve` listens on 127.0.0.1 only** (doc/local-only.md), so nothing outside the pod
# can reach it directly. A second container, Caddy, shares the pod's network, listens on the
# pod's address and hands every request to grind on loopback: Caddy is the reverse proxy, and
# grind still never listens beyond loopback. grind answers only requests addressed to a name it
# was given, so the host name the Ingress or Gateway serves goes into `--host` below.
#
# **This one has state**: the documents, on the PersistentVolumeClaim at the end. One replica,
# replaced rather than rolled, because two servers over one directory would each take the other's
# saves for somebody else's. Back up the volume; the page keeps no copy.
#
# Namespace, ConfigMap, PersistentVolumeClaim, Deployment, Service, in that order.
---
apiVersion: v1
kind: Namespace
metadata:
  name: grind
  labels:
    app.kubernetes.io/name: grind-web
    # Both images run unprivileged and the pod below satisfies the `restricted` Pod Security
    # Standard as written, so enforce it rather than leaving it to the cluster default. If this
    # fails to admit, the pod spec regressed.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# The whole proxy: the pod's port 8081 to grind on loopback, compressed — grind sends the 3 MB
# WebAssembly module as it is. Caddy keeps the request's Host and Origin, which is what grind
# checks them against.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grind-web-proxy
  namespace: grind
  labels:
    app.kubernetes.io/name: grind-web
    app.kubernetes.io/part-of: grind
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }
    :8081 {
      encode zstd gzip
      reverse_proxy 127.0.0.1:8080
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grind-documents
  namespace: grind
  labels:
    app.kubernetes.io/name: grind-web
    app.kubernetes.io/part-of: grind
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grind-web
  namespace: grind
  labels:
    app.kubernetes.io/name: grind-web
    app.kubernetes.io/component: browser-shell
    app.kubernetes.io/part-of: grind
spec:
  replicas: 1
  # The old pod lets go of the volume before the new one takes it.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: grind-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grind-web
        app.kubernetes.io/component: browser-shell
        app.kubernetes.io/part-of: grind
    spec:
      # It talks to no API server and to nothing else in the cluster.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the volume is writable by that user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: grind-web
          # Published by .github/workflows/container.yml on every push to main, as a
          # multi-arch manifest, so this one line is amd64 and arm64 both.
          #
          # `latest` is a moving tag: `imagePullPolicy: Always` is what makes a
          # restarted pod pick up a new build, and is also why a rollout is not
          # reproducible. For anything you want to be able to roll back to, pin the
          # digest instead and drop the pull policy:
          #
          #   docker buildx imagetools inspect ghcr.io/fwilhe2/grind-web:latest
          #   image: ghcr.io/fwilhe2/grind-web@sha256:<digest>
          image: ghcr.io/fwilhe2/grind-web:latest
          imagePullPolicy: Always
          # EDIT: the host name httproute.yaml or ingress.yaml serves. `localhost` (what
          # `kubectl port-forward` sends) is always allowed.
          args: ["serve", "/documents", "--port", "8080", "--host", "grind.example.com"]

          # No port: grind listens on the pod's loopback, which the proxy below shares.

          volumeMounts:
            - name: documents
              mountPath: /documents

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              # A document is held in memory while a save is checked; the page itself is
              # served from disk.
              memory: 256Mi
              cpu: "1"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        - name: proxy
          image: docker.io/library/caddy:2
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          # The kubelet probes the pod's address, which reaches the proxy and through it grind;
          # the Host header is one grind answers to, since the pod's IP is not.
          readinessProbe:
            httpGet:
              path: /api/v1/hello
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/hello
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: proxy-config
              mountPath: /etc/caddy
              readOnly: true
            # Caddy's own state directories; it keeps nothing worth keeping here.
            - name: proxy-data
              mountPath: /data
            - name: proxy-state
              mountPath: /config

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
              cpu: "1"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: grind-documents
        - name: proxy-config
          configMap:
            name: grind-web-proxy
        - name: proxy-data
          emptyDir: {}
        - name: proxy-state
          emptyDir: {}

      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: grind-web
  namespace: grind
  labels:
    app.kubernetes.io/name: grind-web
    app.kubernetes.io/part-of: grind
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grind-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
