#
# The browser shell and `grind serve` behind it, deployed with Docker Compose: the page at
# http://127.0.0.1:8080/ on this computer, over the documents in ./documents beside this file.
#
#   mkdir -p ui_web/deploy/documents       # first, or Docker makes it, owned by root
#   docker compose -f ui_web/deploy/compose.yaml up -d
#   docker compose -f ui_web/deploy/compose.yaml logs -f
#   docker compose -f ui_web/deploy/compose.yaml down
#
# and to run the working tree rather than the published image — a full Rust compile, several
# minutes the first time:
#
#   docker compose -f ui_web/deploy/compose.yaml --profile source up --build web-source
#
# The documents are a directory on the host, not a volume Docker keeps: every other grind — the
# command line, the desktop windows — opens the same files, and backing up is copying the
# directory. GRIND_DOCUMENTS names another one.
#
# `grind serve` listens on 127.0.0.1 only, so the container shares the host's network instead
# of publishing a port: nothing here is reachable from another computer. kubernetes.yaml is the
# sample that is, through a proxy in the pod.
#
# Podman: ui_web/deploy/podman.sh runs the same container without Compose. Under rootless
# Podman, `podman compose` needs its service started with PODMAN_USERNS=keep-id, or the user
# below is a subordinate uid that cannot write the directory.

name: grind-web

# The two services differ only in where the image comes from, so the rest is written once.
x-web: &web
  network_mode: host
  # grind as PID 1 would not stop on SIGTERM; the init process forwards it.
  init: true
  # The documents' owner, so a file the server writes is yours on the host. 1000 is the first
  # user on most Linux systems; `id -u` and `id -g` say yours.
  user: "${GRIND_UID:-1000}:${GRIND_GID:-1000}"
  volumes:
    # `:z` relabels for SELinux (Fedora, RHEL) and is ignored elsewhere.
    - "${GRIND_DOCUMENTS:-./documents}:/documents:z"
  # Nothing but the documents is written.
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 256M
  restart: unless-stopped

services:
  # The image `.github/workflows/container.yml` publishes on every push to main: multi-arch,
  # so this is the same line on amd64 and arm64.
  web:
    <<: *web
    image: ghcr.io/fwilhe2/grind-web:latest

  # The same thing built from this checkout. Under a profile because both listen on 8080 and
  # so cannot run at once. The context is the repository root: the page and grind are built
  # from one tree.
  web-source:
    <<: *web
    profiles: ["source"]
    image: grind-web:local
    build:
      context: ../..
      dockerfile: ui_web/Dockerfile
