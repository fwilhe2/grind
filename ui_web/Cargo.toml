[package]
name = "grind-web"
version = "0.0.0"
description = "An ODF-native office suite — the browser shell"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib is what `cargo build --target wasm32-unknown-unknown` turns into a `.wasm`
# module; rlib keeps `cargo test` working on the host, where the keymap and the
# layout arithmetic run with no browser in sight.
crate-type = ["cdylib", "rlib"]

# The import filters: on by default, as in `grind-cli`. They add no dependency the bundle does
# not already carry — `zip` and `quick-xml` are the core's.
[features]
default = ["xlsx", "docx"]
xlsx = ["grind-open/xlsx"]
docx = ["grind-open/docx"]

[dependencies]
grind-open = { path = "../open", default-features = false }
grind-core = { path = "../core" }
grind-sheet = { path = "../sheet" }
grind-text = { path = "../text" }
# Spelling (`doc/spelling.md`): Hunspell's checker and the rules, **without** the twelve megabytes
# of word lists — the page fetches the one language it needs from `dictionaries/`
# (`grind_spell::Language::provide`), the way it fetches the PDF fonts.
grind-spell = { path = "../spell", default-features = false }
wasm-bindgen = "0.2"
# Reading a picked file is a promise, and it is the only async thing here.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# web-sys is one crate with a feature per web API: every DOM type this shell touches
# has to be listed here or it does not exist.
[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "CanvasRenderingContext2d",
  "BlobPropertyBag",
  "Clipboard",
  "ClipboardEvent",
  # A dead key produces its character on `compositionend` and nowhere else.
  "CompositionEvent",
  "CssStyleDeclaration",
  "DataTransfer",
  "Document",
  "DomRect",
  "DomStringMap",
  "DomTokenList",
  "DragEvent",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "HtmlCollection",
  # The About dialog (`about.rs`): the browser's own modal, with Esc and a backdrop.
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  # The alt text dialog's long description.
  "HtmlTextAreaElement",
  # A page of the print preview, put onto its canvas.
  "ImageData",
  "KeyboardEvent",
  "Location",
  # `prefers-color-scheme`, which a document's own colours are made to read against (`ink.rs`).
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "Node",
  "Response",
  # The remembered spelling setting (`spelling.rs`), per kind of document.
  "Storage",
  "SvgElement",
  "Text",
  "TextMetrics",
  "Url",
  "WheelEvent",
  "Window",
  "console",
]

[dev-dependencies]
# Only so a test can hold `FONT_FILES` to the list the print module fetches by
# (`grind_print::fonts::BUNDLED_NAMES`); the bundle itself never links it.
grind-print = { path = "../print", default-features = false }
