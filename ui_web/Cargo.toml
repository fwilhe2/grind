[package]
name = "grind-web"
version = "0.0.0"
description = "An ODF-native spreadsheet — the browser shell"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib is what `cargo build --target wasm32-unknown-unknown` turns into a `.wasm`
# module; rlib keeps `cargo test` working on the host, where the keymap and the
# layout arithmetic run with no browser in sight.
crate-type = ["cdylib", "rlib"]

[dependencies]
grind-sheet = { path = "../sheet" }
wasm-bindgen = "0.2"
# Reading a picked file is a promise, and it is the only async thing here.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# web-sys is one crate with a feature per web API: every DOM type this shell touches
# has to be listed here or it does not exist.
[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "BlobPropertyBag",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlButtonElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "Node",
  "Response",
  "Url",
  "WheelEvent",
  "Window",
  "console",
]
