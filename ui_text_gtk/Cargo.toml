[package]
name = "grind-text-gtk"
version = "0.0.0"
description = "An ODF-native word processor for GNOME"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "grind-text-gtk"
path = "src/main.rs"

# A second binary rather than a mode of `grind-sheet-gtk`, because a `.desktop` file's
# `MimeType=` is how a desktop associates an application with a file type and one entry
# claiming both spreadsheets and text documents is what makes "Open With" useless
# (`doc/suite.md`, "One binary per document type — for GTK only").
# The import filters, on by default as everywhere else. A `.docx` opens here as a new, unsaved
# text document; a workbook is recognised so it can be handed to `grind-sheet-gtk`.
[features]
default = ["xlsx", "docx"]
xlsx = ["grind-open/xlsx"]
docx = ["grind-open/docx"]

[dependencies]
grind-open = { path = "../open", default-features = false }
grind-core = { path = "../core" }
grind-text = { path = "../text" }
# PDF export, Print and Print Preview (doc/pdf-export.md). Not optional, unlike `xlsx`: a word
# processor that cannot print is not one.
grind-print = { path = "../print" }
# Spelling (doc/spelling.md): the dictionaries, attached to the `App` on every open.
grind-spell = { path = "../spell" }
# The built-in grammar checker, and the remembered grammar setting (doc/grammar.md).
grind-grammar = { path = "../grammar" }
grind-languagetool = { path = "../languagetool" }
# The same two toolkit versions `ui_sheet_gtk` pins, for the same reasons — see its `Cargo.toml`.
# Nothing here may drift from that shell: cargo unifies them into one crate either way.
libadwaita = { version = "0.7", features = ["v1_5"] }
gtk4 = { version = "0.9", features = ["v4_14"] }
async-channel = "2"

# Read by `cargo deb` (artifacts.yml), and the twin of `ui_sheet_gtk`'s block — the same
# assets under `io.github.fwilhe2.Text`, which is what `doc/suite.md`'s "One binary per
# document type" means in a package: two desktop entries, two AppStream components, two
# icons, four mime types between them. `depends = "$auto"` reads the shared-library needs
# off the built binary rather than naming them twice.
[package.metadata.deb]
name = "grind-text-gtk"
maintainer = "Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
copyright = "2026, Florian Wilhelm <fwilhelm.wgt+github@gmail.com>"
license-file = ["../packaging/copyright", "0"]
section = "gnome"
extended-description = """\
Text is the word processor of grind, an office suite whose native format is \
OpenDocument. It reads and writes .odt and .fodt files directly against the \
OASIS specification and saves by changing as little of a file as it can, so a \
flat .fodt diffs line by line. It has headings, lists, tables, character \
formatting, spelling in seven languages, PDF export and a print preview, and \
reads Markdown as it is typed. Word documents and Markdown files open as new, \
unsaved ODF documents; it never writes Word's format."""
depends = "$auto"
assets = [
    ["target/release/grind-text-gtk", "usr/bin/grind-text-gtk", "755"],
    ["data/io.github.fwilhe2.Text.desktop", "usr/share/applications/", "644"],
    ["data/io.github.fwilhe2.Text.metainfo.xml", "usr/share/metainfo/", "644"],
    [
        "data/icons/hicolor/scalable/apps/io.github.fwilhe2.Text.svg",
        "usr/share/icons/hicolor/scalable/apps/",
        "644",
    ],
]

# Read by `cargo generate-rpm` (artifacts.yml). It has no `$auto` equivalent, so the
# shared-library names are spelled out — the same two libraries `depends` above discovers.
#
# ponytail: the .rpm's Description is its summary again — `cargo generate-rpm` has no key for a
# long one (cat-in-136/cargo-generate-rpm#142), so `extended-description` above reaches the .deb
# only, and GNOME Software shows a local .rpm with one line. Upgrade: that key, once released.
[package.metadata.generate-rpm]
name = "grind-text-gtk"
assets = [
    { source = "target/release/grind-text-gtk", dest = "/usr/bin/grind-text-gtk", mode = "755" },
    { source = "data/io.github.fwilhe2.Text.desktop", dest = "/usr/share/applications/io.github.fwilhe2.Text.desktop", mode = "644" },
    { source = "data/io.github.fwilhe2.Text.metainfo.xml", dest = "/usr/share/metainfo/io.github.fwilhe2.Text.metainfo.xml", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/io.github.fwilhe2.Text.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.fwilhe2.Text.svg", mode = "644" },
    { source = "../LICENSES/AGPL-3.0-or-later.txt", dest = "/usr/share/licenses/grind-text-gtk/AGPL-3.0-or-later.txt", mode = "644" },
]
[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
